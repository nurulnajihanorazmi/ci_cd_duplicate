name: Data Quality CI CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v3

    - name: Initialize Python Environment Runtime
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Install Project Requirement Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Validation Testing Suite
      run: pytest tests/ -v
